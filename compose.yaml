name: campus-sports-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Campus Sports Platform}
      SRS_API_URL: http://media:1985
      LIVE_TITLE: ${LIVE_TITLE:-院系杯 · 网络空间安全学院 vs 电子科学与工程学院}
      LIVE_SPORT: ${LIVE_SPORT:-篮球}
      LIVE_VENUE: ${LIVE_VENUE:-东南大学}
      LIVE_STREAM_KEY: ${LIVE_STREAM_KEY:-demo}
      VOD_DIR: ${VOD_DIR:-/data/vod}
      PHOTO_DIR: /data/photos
    volumes:
      - ./storage/vod:/data/vod:ro
      - ./storage/photos:/data/photos:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  api-test:
    build:
      context: ./apps/api
      target: test
    profiles: ["tools"]

  media:
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1985 && printf 'GET /api/v1/versions HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    image: ossrs/srs:6.0.191
    volumes:
      - ./infra/srs/srs.conf:/usr/local/srs/conf/docker.conf:ro
      - ./storage/live:/usr/local/srs/objs/nginx/html/live
    ports:
      - "${RTMP_PORT:-1935}:1935"
      - "127.0.0.1:${SRS_API_PORT:-1985}:1985"
    expose:
      - "8080"
    logging: *default-logging
    restart: unless-stopped

  web-build:
    build:
      context: ./apps/web
      target: build
    command: ["npm", "run", "check"]
    profiles: ["tools"]

  web:
    build:
      context: ./apps/web
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      media:
        condition: service_healthy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/live:/srv/live:ro
      - ./storage/vod:/srv/vod:ro
      - ./storage/photos:/srv/photos:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
